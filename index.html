<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 → MP3 · lokal konvertieren</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121826;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 16px;
        }
        .card {
            background: #1e263b; border-radius: 32px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.7);
            width: 100%; max-width: 700px; padding: 32px 28px;
            color: #eef2ff; border: 1px solid #2f3b5c;
        }
        h1 { font-size: 2rem; font-weight: 600; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; color: #fff; }
        h1 span {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            font-size: 1.6rem; padding: 8px 12px; border-radius: 50px;
        }
        .subhead { color: #9aa4c9; margin-bottom: 28px; border-left: 4px solid #3b82f6; padding-left: 16px; line-height: 1.4; }
        .upload-area {
            background: #0f1422; border: 2px dashed #2f3b5c; border-radius: 24px;
            padding: 36px 20px; text-align: center; cursor: pointer;
            transition: 0.2s; margin-bottom: 24px; position: relative;
        }
        .upload-area:hover, .upload-area.drag-over {
            border-color: #3b82f6; background: #131b2c;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 3.5rem; margin-bottom: 12px; }
        .upload-text { font-weight: 500; font-size: 1.2rem; color: #b9c2e0; margin-bottom: 6px; }
        .upload-hint { font-size: 0.9rem; color: #6b7a9f; }
        .file-info {
            display: flex; justify-content: space-between; align-items: center;
            background: #0b0f1a; border-radius: 60px; padding: 12px 20px;
            margin-bottom: 22px; border: 1px solid #2a3450; word-break: break-all;
        }
        .file-info .name { font-weight: 500; color: #d6e0ff; }
        .file-info .size { color: #8293b9; font-size: 0.9rem; white-space: nowrap; margin-left: 16px; }
        .progress-container {
            background: #0b0f1a; height: 10px; border-radius: 20px;
            overflow: hidden; margin: 18px 0 8px; border: 1px solid #202a40;
        }
        .progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6, #06b6d4);
            border-radius: 20px; transition: width 0.2s ease;
        }
        .status-text { font-size: 0.9rem; color: #a1b0d9; display: flex; justify-content: space-between; margin-top: 6px; }
        .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
        button {
            background: #2a3450; border: none; border-radius: 60px;
            padding: 14px 24px; font-weight: 600; font-size: 1rem;
            color: #eef2ff; display: inline-flex; align-items: center;
            justify-content: center; gap: 10px; cursor: pointer;
            transition: 0.15s; flex: 1 0 auto;
            border: 1px solid #3e4b6e; box-shadow: 0 6px 0 #0b0f1a;
        }
        button.primary {
            background: linear-gradient(145deg, #4f46e5, #3b82f6);
            border-color: #6d8aff; box-shadow: 0 6px 0 #1a2340;
        }
        button.primary:not(:disabled):hover { background: linear-gradient(145deg, #6366f1, #4f8eff); transform: translateY(-2px); }
        button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #0b0f1a; }
        button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #0b0f1a; }
        .download-btn { background: #059669; border-color: #10b981; box-shadow: 0 6px 0 #064e3b; }
        .download-btn:not(:disabled):hover { background: #10b981; }
        .badge { background: #2a3450; padding: 6px 12px; border-radius: 60px; font-size: 0.8rem; color: #b9c2e0; display: inline-block; }
        .footnote { margin-top: 24px; font-size: 0.78rem; color: #5b6a8c; text-align: center; border-top: 1px solid #1e263b; padding-top: 18px; }
        .error-msg { color: #fca5a5; background: #2a1a2a; border-radius: 40px; padding: 8px 16px; font-size: 0.9rem; margin-top: 12px; border: 1px solid #b91c1c; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span>🎵</span> MP4 → MP3</h1>
        <div class="subhead">Direkt im Browser konvertieren · keine Uploads · 100% lokal</div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept=".mp4,video/mp4,audio/mp4,video/*" />
            <div class="upload-icon">📁</div>
            <div class="upload-text">MP4‑Datei auswählen</div>
            <div class="upload-hint">oder hierher ziehen · max. 1 GB (empfohlen)</div>
        </div>

        <div id="fileInfo" class="file-info hidden">
            <span class="name" id="fileName">—</span>
            <span class="size" id="fileSize">—</span>
        </div>

        <div id="progressSection" class="hidden">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>
            <div class="status-text">
                <span id="statusLabel">Bereit</span>
                <span id="percentLabel">0%</span>
            </div>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <div class="actions">
            <button id="convertBtn" class="primary" disabled>⚡ Konvertieren zu MP3</button>
            <button id="downloadBtn" class="download-btn" disabled>⬇️ MP3 herunterladen</button>
        </div>
        <div class="footnote"><span class="badge">🔒 Daten verlassen dein Gerät nicht</span></div>
    </div>

    <!-- ===== HIER wird die lokale lame.min.js eingebunden ===== -->
    <script src="lame.min.js"></script>
    <script>
    (function(){
        // ---------- DOM ----------
        const uploadArea     = document.getElementById('uploadArea');
        const fileInput      = document.getElementById('fileInput');
        const fileInfoDiv    = document.getElementById('fileInfo');
        const fileNameSpan   = document.getElementById('fileName');
        const fileSizeSpan   = document.getElementById('fileSize');
        const progressSection= document.getElementById('progressSection');
        const progressBar    = document.getElementById('progressBar');
        const statusLabel    = document.getElementById('statusLabel');
        const percentLabel   = document.getElementById('percentLabel');
        const convertBtn     = document.getElementById('convertBtn');
        const downloadBtn    = document.getElementById('downloadBtn');
        const errorMsgDiv    = document.getElementById('errorMsg');

        // ---------- State ----------
        let currentFile  = null;
        let mp3Blob      = null;
        let mp3FileName  = 'audio.mp3';
        let isConverting = false;

        // ---------- Helfer ----------
        function formatBytes(bytes) {
            if (!bytes) return '0 Bytes';
            const k = 1024, sizes = ['Bytes','KB','MB','GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        function showError(msg) {
            errorMsgDiv.textContent = msg;
            errorMsgDiv.classList.remove('hidden');
            clearTimeout(errorMsgDiv._timer);
            errorMsgDiv._timer = setTimeout(() => errorMsgDiv.classList.add('hidden'), 7000);
        }
        function clearError() { errorMsgDiv.textContent = ''; errorMsgDiv.classList.add('hidden'); }
        function setProgress(pct, text) {
            pct = Math.min(100, Math.max(0, pct));
            progressBar.style.width = pct + '%';
            percentLabel.textContent = Math.round(pct) + '%';
            if (text !== undefined) statusLabel.textContent = text;
        }

        // ---------- Datei Handling ----------
        function handleFile(file) {
            const isMp4 = file.type === 'video/mp4'
                       || file.type === 'audio/mp4'
                       || file.name.toLowerCase().endsWith('.mp4');
            if (!isMp4) { showError('Bitte wähle eine MP4‑Datei aus.'); return; }
            if (file.size > 1024*1024*1024) {
                showError(`Die Datei ist größer als 1 GB (${formatBytes(file.size)}).`);
            }

            currentFile = file;
            fileNameSpan.textContent = file.name;
            fileSizeSpan.textContent = formatBytes(file.size);
            fileInfoDiv.classList.remove('hidden');

            mp3Blob = null;
            downloadBtn.disabled = true;
            convertBtn.disabled = false;
            progressSection.classList.remove('hidden');
            setProgress(0, 'Bereit zur Konvertierung');
            clearError();
        }

        // ---------- Konvertierung ----------
        async function convertToMp3() {
            if (!currentFile) { showError('Keine Datei ausgewählt.'); return; }
            if (isConverting) return;

            // Prüfen ob lamejs geladen ist
            if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
                showError('MP3-Encoder (lamejs) wurde nicht geladen. Stelle sicher, dass lame.min.js im selben Ordner liegt.');
                return;
            }

            isConverting = true;
            convertBtn.disabled = true;
            downloadBtn.disabled = true;
            clearError();
            setProgress(5, 'Lese Datei …');

            try {
                // 1) Datei als ArrayBuffer lesen
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden.'));
                    reader.readAsArrayBuffer(currentFile);
                });

                setProgress(15, 'Dekodiere Audio …');

                // 2) Audio dekodieren
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let audioBuffer;
                try {
                    audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                } catch (err) {
                    throw new Error('Konnte Audio nicht dekodieren. Unterstützt dein Browser das Format?');
                } finally {
                    if (audioCtx.state !== 'closed') await audioCtx.close();
                }
                if (!audioBuffer || audioBuffer.length === 0) {
                    throw new Error('Audiodaten konnten nicht extrahiert werden.');
                }

                setProgress(40, 'Konvertiere zu MP3 …');

                // 3) PCM-Daten vorbereiten
                const numChannels = audioBuffer.numberOfChannels;
                const sampleRate  = audioBuffer.sampleRate;
                const length      = audioBuffer.length;
                const leftF  = audioBuffer.getChannelData(0);
                const rightF = numChannels >= 2 ? audioBuffer.getChannelData(1) : leftF;

                const left  = new Int16Array(length);
                const right = new Int16Array(length);
                for (let i = 0; i < length; i++) {
                    const l = Math.max(-1, Math.min(1, leftF[i]));
                    const r = Math.max(-1, Math.min(1, rightF[i]));
                    left[i]  = l < 0 ? l * 0x8000 : l * 0x7FFF;
                    right[i] = r < 0 ? r * 0x8000 : r * 0x7FFF;
                }

                // 4) MP3 encodieren
                const bitRate = 128;
                const encoder = new lamejs.Mp3Encoder(2, sampleRate, bitRate);
                const blockSize = 1152;
                const chunks = [];
                let processed = 0;

                for (let i = 0; i < length; i += blockSize) {
                    const leftChunk  = left.subarray(i, i + blockSize);
                    const rightChunk = right.subarray(i, i + blockSize);
                    const buf = encoder.encodeBuffer(leftChunk, rightChunk);
                    if (buf.length > 0) chunks.push(new Uint8Array(buf));
                    processed += leftChunk.length;
                    setProgress(40 + (processed / length) * 55, 'Konvertiere zu MP3 …');
                }
                const final = encoder.flush();
                if (final.length > 0) chunks.push(new Uint8Array(final));

                if (chunks.length === 0) {
                    throw new Error('MP3-Encoding fehlgeschlagen (keine Daten).');
                }

                // 5) Blob erzeugen
                mp3Blob = new Blob(chunks, { type: 'audio/mpeg' });
                const baseName = currentFile.name.replace(/\.mp4$/i, '') || 'audio';
                mp3FileName = baseName + '.mp3';

                setProgress(100, 'Konvertierung abgeschlossen');
                downloadBtn.disabled = false;
            } catch (err) {
                console.error(err);
                showError(err.message || 'Unbekannter Fehler bei der Konvertierung.');
                setProgress(0, 'Fehler');
                downloadBtn.disabled = true;
            } finally {
                isConverting = false;
                convertBtn.disabled = false;
            }
        }

        // ---------- Download ----------
        function downloadMp3() {
            if (!mp3Blob) { showError('Keine MP3-Datei vorhanden.'); return; }
            const url = URL.createObjectURL(mp3Blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = mp3FileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        // ---------- Events ----------
        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) handleFile(file);
            fileInput.value = '';
        });

        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });
        uploadArea.addEventListener('click', e => {
            if (e.target.tagName !== 'INPUT') fileInput.click();
        });

        convertBtn.addEventListener('click', convertToMp3);
        downloadBtn.addEventListener('click', downloadMp3);

        // Initial
        progressSection.classList.add('hidden');
        fileInfoDiv.classList.add('hidden');
        errorMsgDiv.classList.add('hidden');
    })();
    </script>
</body>
</html>
